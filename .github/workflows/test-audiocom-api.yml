name: Test Audio.com API access

on:
  push:
    paths:
      - 'scripts/test_audiocom_api.py'
      - '.github/workflows/test-audiocom-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install requests
      - name: Test authenticated Audio.com API
        env:
          AUDIOCOM_TOKEN: ${{ secrets.AUDIOCOM_TOKEN }}
        run: python scripts/test_audiocom_api.py
