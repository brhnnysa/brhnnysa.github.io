name: Update BRHN NYSA music releases

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-brhn-nysa-music
  cancel-in-progress: false

jobs:
  refresh-releases:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper dependency
        run: python -m pip install requests requests-oauthlib

      - name: Refresh public Audiomack releases
        run: python scripts/update_releases.py
        env:
          AUDIOMACK_CONSUMER_KEY: ${{ secrets.AUDIOMACK_CONSUMER_KEY }}
          AUDIOMACK_CONSUMER_SECRET: ${{ secrets.AUDIOMACK_CONSUMER_SECRET }}

      - name: Commit feed when it changes
        run: |
          if git diff --quiet -- data/releases.json; then
            echo "No new release metadata."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/releases.json
          git commit -m "chore: refresh BRHN NYSA music releases"
          git push
