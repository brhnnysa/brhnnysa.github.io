name: Update BRHN NYSA music releases

on:
  push:
    paths:
      - '.github/workflows/update-music.yml'
      - 'scripts/update_releases.py'
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-brhn-nysa-music
  cancel-in-progress: false

jobs:
  refresh-releases:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper dependency
        run: python -m pip install requests

      - name: Refresh latest SoundCloud RSS releases
        run: python scripts/update_releases.py

      - name: Commit feed when it changes
        run: |
          if git diff --quiet -- data/releases.json; then
            echo "No new release metadata."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/releases.json
          git commit -m "chore: refresh BRHN NYSA music releases"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Music release feed published."
              exit 0
            fi
            echo "Push race detected; retrying with the latest main branch."
            sleep 2
          done
          echo "Could not publish music release feed after three attempts."
          exit 1
