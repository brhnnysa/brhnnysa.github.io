name: Update BRHN NYSA albums

on:
  push:
    paths:
      - 'scripts/update_albums.py'
      - '.github/workflows/update-albums.yml'
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-brhn-nysa-albums
  cancel-in-progress: false

jobs:
  refresh-albums:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install requests
      - name: Refresh Audio.com album collections
        env:
          AUDIOCOM_TOKEN: ${{ secrets.AUDIOCOM_TOKEN }}
        run: python scripts/update_albums.py
      - name: Commit album feed when it changes
        run: |
          if git diff --quiet -- data/albums.json; then
            echo "No album metadata changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/albums.json
          git commit -m "chore: refresh BRHN NYSA album feed"
          git pull --rebase origin main
          git push
