name: Update BRHN NYSA albums

on:
  push:
    paths:
      - 'scripts/update_albums.py'
      - '.github/workflows/update-albums.yml'
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-brhn-nysa-albums
  cancel-in-progress: false

jobs:
  refresh-albums:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install requests
      - name: Refresh Audio.com album collections
        env:
          AUDIOCOM_TOKEN: ${{ secrets.AUDIOCOM_TOKEN }}
        run: python scripts/update_albums.py
      - name: Commit album feed when it changes
        run: |
          git add data/albums.json
          if git diff --cached --quiet -- data/albums.json; then
            echo "No album metadata changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh BRHN NYSA album feed"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Album feed published."
              exit 0
            fi
            echo "Push race detected; retrying with the latest main branch."
            sleep 2
          done
          echo "Could not publish album feed after three attempts."
          exit 1
