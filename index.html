<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Brhn Nysa 
    <style>
        body { background-color: #121212; color: #ffffff; font-family: 'Helvetica Neue', Arial, sans-serif; text-align: center; padding: 20px; margin: 0; }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        h1 { color: #ff0055; font-size: 3.5rem; margin-bottom: 5px; letter-spacing: 2px; }
        .subtitle { color: #aaaaaa; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 30px; }
        
        /* Artist Profile Pic Section */
        .profile-pic { width: 200px; height: 200px; border-radius: 50%; object-fit: cover; border: 3px solid #ff0055; margin-bottom: 20px; box-shadow: 0 0 20px rgba(255, 0, 85, 0.3); }
        
        /* Sections Layout */
        .section { background: #1a1a1a; padding: 30px; border-radius: 12px; margin-bottom: 30px; border: 1px solid #2a2a2a; }
        h2 { color: #ff0055; font-size: 1.8rem; margin-top: 0; border-bottom: 1px solid #2a2a2a; padding-bottom: 10px; }
        p { color: #dddddd; line-height: 1.6; font-size: 1.1rem; }
        
        /* Social Media Buttons */
        .social-links { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-top: 20px; }
        .btn { background: transparent; color: #ffffff; border: 2px solid #ffffff; padding: 10px 20px; border-radius: 25px; text-decoration: none; font-weight: bold; transition: all 0.3s ease; }
        .btn:hover { background: #ff0055; border-color: #ff0055; transform: translateY(-2px); }
        
        /* Responsive Video Container */
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; max-width: 100%; background: #000; border-radius: 8px; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    </style>
</head>
<body>

    <div class="container">
        <!-- 1. HEADSHOT SECTION -->
        <!-- Replace the URL inside src="..." with your own picture link later -->
        <img src="https://picsum.photos" alt="BRHNNYSA Headshot" class="profile-pic">

        <h1>BRHNNYSA</h1>
        <div class="subtitle">Official Artist Profile</div>

        <!-- 2. BIOGRAPHY SECTION -->
        <div class="section">
            <h2>About</h2>
            <p>Welcome to the official hub of BRHNNYSA. Stay tuned for upcoming music releases, official media, and live tour updates straight from the studio.</p>
        </div>

        <!-- 3. VIDEO SECTION -->
        <div class="section">
            <h2>Featured Video</h2>
            <div class="video-container">
                <!-- Replace the YouTube code inside src="..." with your own video link later -->
                <iframe src="https://youtube.com" allowfullscreen></iframe>
            </div>
        </div>

        <!-- 4. LIVE EVENTS / TOUR SECTION -->
        <div class="section">
            <h2>Tour Dates</h2>
            <!-- https://www.bandsintown.com/a/15666367-brhn-nysa -->
            <p>Live performances and updates are loading soon...</p>
        </div>

        <!-- 5. OFFICIAL PROFILES / SOCIAL LINKS -->
        <div class="section">
            <h2>Connect</h2>
            <div class="social-links">
                <a href="https://instagram.com" target="_blank" class="btn">Instagram</a>
                <a href="https://youtube.com" target="_blank" class="btn">YouTube</a>
                <a href="https://tiktok.com" target="_blank" class="btn">TikTok</a>
                <a href="https://twitter.com" target="_blank" class="btn">X / Twitter</a>
            </div>
        </div>
    </div>

</body>
</html>
