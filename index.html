<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brhn Nysa</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --text-color: #c5c6c7;
            --accent-color: #66fcf1;
            --accent-hover: #45a29e;
            --card-bg: #1f2833;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        header {
            text-align: center;
            padding: 4rem 2rem 2rem 2rem;
            background: linear-gradient(180deg, #1f2833 0%, #0b0c10 100%);
        }
        .profile-img {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--accent-color);
            box-shadow: 0 0 20px rgba(102, 252, 241, 0.3);
            margin-bottom: 1.5rem;
        }
        header h1 {
            color: #fff;
            margin: 0 0 0.5rem 0;
            font-size: 2.5rem;
            letter-spacing: 2px;
        }
        .subtitle-main {
            color: var(--accent-color);
            margin: 0 0 0.2rem 0;
            font-size: 1.3rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .subtitle-sub {
            color: #fff;
            margin: 0;
            font-size: 1.1rem;
            font-weight: 300;
            letter-spacing: 1px;
            opacity: 0.8;
        }
        main {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem;
        }
        section {
            margin-bottom: 4rem;
        }
        h2 {
            color: #fff;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 0.5rem;
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
        }
        .featured-track, .album-container, .discography-table {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }
        .play-btn {
            background-color: var(--accent-color);
            color: var(--bg-color);
            border: none;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <header>
        <img src="https://wikimedia.org" alt="Brhn Nysa" class="profile-img">
        <h1>Brhn Nysa</h1>
        <p class="subtitle-main">Official Website</p>
        <p class="subtitle-sub">Nigerian Singer-Songwriter</p>
    </header>
    <main>
        <section id="featured">
            <h2>Featured Release</h2>
            <div class="featured-track">
                <h3>Still Us (2026)</h3>
                <p><em>"Still Us" was inspired by an individual named Wynstar.</em></p>
                <a href="#" class="play-btn">Listen Now</a>
            </div>
        </section>
    </main>
</body>
</html>
